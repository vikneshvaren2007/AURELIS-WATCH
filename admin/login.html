<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Portal — AURELIS Atelier Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" style="display: grid; place-content: center; min-height: 100vh; padding: 20px;">
  <div class="luxury-card" style="width: min(440px, 92vw); padding: 45px 35px; text-align: center;">
    <p class="eyebrow" style="letter-spacing: 0.3em;">ATELIER EXECUTIVE CONSOLE</p>
    <h2 style="font-size: 26px; color: var(--gold-primary); margin: 6px 0 20px; font-family: var(--font-serif);">AURELIS Admin</h2>
    <p style="color: var(--text-secondary); font-size: 13px; line-height: 1.6; margin-bottom: 30px;">
      Authorized personnel only. Enter administrator credentials for Vikneshvaren.
    </p>

    <form id="adminLoginForm" onsubmit="event.preventDefault(); handleAdminLogin();">
      <div class="form-group" style="text-align: left;">
        <label class="form-label">Administrator Email</label>
        <input type="email" id="adminEmail" class="form-input" placeholder="vikneshvaren@gmail.com" required>
      </div>

      <div class="form-group" style="text-align: left;">
        <label class="form-label">Security Password</label>
        <input type="password" id="adminPassword" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="gold-btn" id="loginBtn" style="width: 100%; margin-top: 15px;">
        Access Atelier Dashboard
      </button>

      <div style="margin-top: 25px; border-top: 1px solid var(--border-subtle); padding-top: 18px; font-size: 11px; color: var(--text-muted);">
        🔒 256-Bit Protected Session &bull; Tenkasi Headquarters
      </div>
    </form>
  </div>

  <script src="../js/api.js"></script>
  <script>
    async function handleAdminLogin() {
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;
      const btn = document.getElementById("loginBtn");

      btn.disabled = true;
      btn.textContent = "VERIFYING CREDENTIALS...";

      try {
        const res = await apiRequest("/api/admin/login", {
          method: "POST",
          body: JSON.stringify({ email, password })
        });
        localStorage.setItem("aurelis_admin_token", res.token);
        showToast("Administrator authorization granted", "success");
        setTimeout(() => window.location.href = "index.html", 800);
      } catch (e) {
        showToast(e.message, "error");
        btn.disabled = false;
        btn.textContent = "Access Atelier Dashboard";
      }
    }
  </script>
</body>
</html>
