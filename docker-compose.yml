version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://aurelis_admin:aurelis_db_password@db:5432/aurelis_db}
      - SECRET_KEY=${SECRET_KEY:-aurelis_jwt_secret_key_change_in_production}
      - ADMIN_NAME=${ADMIN_NAME:-Vikneshvaren}
      - ADMIN_PHONE=${ADMIN_PHONE:-9445437069}
      - ADMIN_LOCATION=${ADMIN_LOCATION:-Tenkasi, Main Road, opposite the bus stand}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-vikneshvaren@gmail.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@AurelisChangeMe!}
      - PAYMENT_KEY_ID=${PAYMENT_KEY_ID:-rzp_test_placeholder_key}
      - PAYMENT_KEY_SECRET=${PAYMENT_KEY_SECRET:-rzp_test_placeholder_secret}
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aurelis_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurelis_db_password}
      POSTGRES_DB: aurelis_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

volumes:
  postgres_data:
