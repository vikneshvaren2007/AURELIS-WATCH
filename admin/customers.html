  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <div class="admin-header-title">
        <h3>Collectors Directory</h3>
        <p>Registered horology clients, acquisition frequencies, and lifetime values</p>
      </div>
    </header>

    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <h4>Client Records</h4>
        </div>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Collector Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Total Commissions</th>
              <th>Total Spent</th>
              <th>Registered Date</th>
            </tr>
          </thead>
          <tbody id="adminCustomersTable"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    async function loadCustomers() {
      try {
        const res = await apiRequest("/api/admin/customers");
        const tbody = document.getElementById("adminCustomersTable");
        tbody.innerHTML = res.customers.map(c => `
          <tr>
            <td><strong>${c.name}</strong></td>
            <td>${c.email}</td>
            <td>${c.phone || '-'}</td>
            <td><strong>${c.order_count}</strong></td>
            <td>${formatINR(c.total_spent)}</td>
            <td>${new Date(c.created_at).toLocaleDateString()}</td>
          </tr>
        `).join("");
      } catch (e) {
        showToast(e.message, "error");
      }
    }
    document.addEventListener("DOMContentLoaded", loadCustomers);
  </script>
</body>
</html>
