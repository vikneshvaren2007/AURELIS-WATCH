<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Transactions — AURELIS Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <div class="admin-brand-text">
        <h2>AURELIS</h2>
        <span>Atelier Executive Console</span>
      </div>
      <button type="button" class="admin-sidebar-close" onclick="Admin.closeMobileSidebar()" aria-label="Close Menu">&times;</button>
    </div>
    <nav class="admin-nav">
      <a href="index.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Dashboard</span>
      </a>
      <a href="orders.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        <span>Orders Lifecycle</span>
      </a>
      <a href="payments.html" class="admin-nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
        <span>Payment Audit</span>
      </a>
      <a href="settings.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Store Settings</span>
      </a>
    </nav>
  </aside>

  <div class="admin-sidebar-backdrop" onclick="Admin.closeMobileSidebar()"></div>

  <main class="admin-main">
    <header class="admin-header">
      <button type="button" id="adminMobileToggle" class="admin-mobile-toggle" aria-label="Toggle Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="admin-header-title">
        <h3>Payment Gateway Audit</h3>
        <p>Cryptographic transaction log, Razorpay payment IDs, and verification records</p>
      </div>
    </header>

    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <h4>Transaction Records</h4>
        </div>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Order Number</th>
              <th>Collector</th>
              <th>Gateway</th>
              <th>Transaction Reference ID</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Timestamp</th>
            </tr>
          </thead>
          <tbody id="adminPaymentsTable"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    async function loadPayments() {
      try {
        const res = await apiRequest("/api/admin/payments");
        const tbody = document.getElementById("adminPaymentsTable");
        tbody.innerHTML = res.payments.map(p => `
          <tr>
            <td><strong>${p.order_number}</strong></td>
            <td>${p.customer_name}</td>
            <td>${p.gateway} &bull; ${p.payment_method}</td>
            <td><code style="color: var(--gold-light);">${p.gateway_payment_id || p.gateway_order_id || 'COD_RECORD'}</code></td>
            <td>${formatINR(p.amount)}</td>
            <td><span class="status-pill status-${p.status}">${p.status}</span></td>
            <td>${new Date(p.created_at).toLocaleDateString()}</td>
          </tr>
        `).join("");
      } catch (e) {
        showToast(e.message, "error");
      }
    }
    document.addEventListener("DOMContentLoaded", loadPayments);
  </script>
</body>
</html>
